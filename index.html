<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varla Halloween-karta – anmäl ditt hus</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --night: #1a1030; --ink: #f4ead8; --pumpkin: #ff8a1f; --cobweb: #a99bc7; --ghost: #f4ead8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--ink); font-family: Nunito, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 8px 0 32px; }

  .banner { padding: 0 6px; }
  .banner svg { display: block; width: 100%; height: auto; }
  .intro { margin: 4px 18px 0; color: var(--cobweb); text-align: center; }

  .maplink {
    margin: 16px 18px 0; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center;
    background: #261a44; border: 1px solid var(--pumpkin); border-radius: 12px; color: var(--ink);
    text-decoration: none; font-weight: 600; font-size: 1.05rem;
  }
  .maplink small { color: var(--cobweb); font-weight: 400; }
  .maplink.disabled { opacity: .55; pointer-events: none; border-color: #4a3a72; }

  .mine {
    margin: 12px 18px 0; padding: 14px 16px; border-radius: 12px; background: #261a44; border: 1px solid #4a3a72;
    display: none; gap: 8px; flex-direction: column;
  }
  .mine.show { display: flex; }
  .mine b { font-size: 1.05rem; }
  .mine .code { font-family: monospace; font-size: 1.15rem; letter-spacing: .08em; color: var(--pumpkin); }
  .mine small { color: var(--cobweb); }

  form { padding: 16px 18px 12px; display: grid; gap: 10px; }
  input[type=text] {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 1rem;
    background: #261a44; color: var(--ink); border: 1px solid #4a3a72; border-radius: 10px;
  }
  input[type=text]:focus { outline: 2px solid var(--pumpkin); outline-offset: 1px; }
  .addr { display: grid; grid-template-columns: 1fr 88px; gap: 8px; }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice label {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; border-radius: 10px; border: 1px solid #4a3a72; cursor: pointer; font-weight: 600;
  }
  .choice input { display: none; }
  .choice input:checked + span { color: var(--night); }
  .choice label:has(input:checked) { background: var(--pumpkin); border-color: var(--pumpkin); }
  .choice label:has(#ghostOpt:checked) { background: var(--ghost); }
  button {
    padding: 14px; font: inherit; font-size: 1.05rem; font-weight: 600; border: 0; border-radius: 10px;
    background: var(--pumpkin); color: var(--night); cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .danger { background: transparent; color: #ff6b6b; border: 1px solid #ff6b6b; }
  #msg { min-height: 1.3em; font-size: .95rem; }
  #msg.err { color: #ff6b6b; }
  #msg.ok { color: #9be89b; }

  details { margin: 0 18px; color: var(--cobweb); font-size: .95rem; }
  details summary { cursor: pointer; }
  details .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
</style>
</head>

  <p class="intro">Anmäl ditt hus i <span id="town"></span> – så syns det direkt på kartan för alla som går bus eller godis.</p>

  <a class="maplink" id="maplink" href="karta.html">
    <span id="maplinkText">🗺️ Öppna kartan</span>
    <small id="count">Laddar…</small>
  </a>

  <div class="mine" id="mine">
    <b>Ditt hus är anmält</b>
    <span id="mineAddr"></span>
    <span>Din raderingskod: <span class="code" id="mineCode"></span></span>
    <small>Spara koden – med den kan du ta bort huset från vilken mobil som helst.</small>
    <button type="button" class="danger" id="removeBtn">Ta bort mitt hus</button>
  </div>

  <form id="f">
    <div class="addr">
      <input type="text" id="street" placeholder="Gata" autocomplete="address-line1" required>
      <input type="text" id="number" placeholder="Nr" inputmode="numeric" required>
    </div>
    <input type="text" id="name" placeholder="Namn eller hälsning (valfritt)" maxlength="60">
    <div class="choice">
      <label><input type="radio" name="scary" value="1" checked><span>🎃 Läskigt hus</span></label>
      <label><input type="radio" name="scary" value="0" id="ghostOpt"><span>👻 Snällt hus</span></label>
    </div>
    <button type="submit" id="btn">Lägg till mitt hus</button>
    <div id="msg"></div>
  </form>

  <details>
    <summary>Har du en raderingskod?</summary>
    <div class="row">
      <input type="text" id="codeIn" placeholder="T.ex. K7Q2-M9XA" autocapitalize="characters">
      <button type="button" class="danger" id="codeBtn">Ta bort</button>
    </div>
  </details>
</main>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
  const CFG = window.HALLOWEEN;
  document.getElementById('town').textContent = CFG.TOWN;
  const KEY = 'halloween_mine';

  function setMsg(t, cls) { const m = document.getElementById('msg'); m.textContent = t; m.className = cls || ''; }
  const showErr = err => setMsg(err.message || String(err), 'err');

  async function load() {
    try {
      const { entries } = await api({ action: 'list' });
      document.getElementById('count').textContent =
        entries.length ? entries.length + ' hus anmälda hittills' : 'Inga hus anmälda ännu – bli först!';
    } catch (e) { document.getElementById('count').textContent = 'Kunde inte hämta antal'; }
  }

  async function loadMapStatus() {
    const link = document.getElementById('maplink');
    try {
      const { enabled } = await api({ action: 'status' });
      if (enabled === false) {
        link.removeAttribute('href');
        link.classList.add('disabled');
        document.getElementById('maplinkText').textContent = '🗺️ Kartan är stängd just nu';
        document.getElementById('count').textContent = 'Kika tillbaka senare';
      }
    } catch (e) { /* status okänd – lämna kartlänken aktiv */ }
  }

  function showMine(m) {
    const box = document.getElementById('mine');
    if (!m) { box.classList.remove('show'); return; }
    document.getElementById('mineAddr').textContent = (m.scary ? '🎃 ' : '👻 ') + m.address;
    document.getElementById('mineCode').textContent = m.code;
    box.classList.add('show');
  }
  const getMine = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };
  function saveMine(m) { try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {} showMine(m); }
  function clearMine() { try { localStorage.removeItem(KEY); } catch (e) {} showMine(null); }
  async function restoreMine() {
    const m = getMine();
    if (!m || !m.code) return;
    showMine(m);
    try { const { entry } = await api({ action: 'mine', code: m.code }); if (!entry) clearMine(); } catch (e) {}
  }

  async function remove(code, onDone) {
    if (!confirm('Ta bort huset från kartan?')) return;
    setMsg('Tar bort…');
    try {
      const r = await api({ action: 'remove', code });
      setMsg('Borttaget: ' + r.address, 'ok'); onDone && onDone(); load();
    } catch (e) { showErr(e); }
  }
  document.getElementById('removeBtn').addEventListener('click', () => { const m = getMine(); if (m) remove(m.code, clearMine); });
  document.getElementById('codeBtn').addEventListener('click', () => {
    const code = document.getElementById('codeIn').value.trim();
    if (!code) { setMsg('Skriv in din raderingskod.', 'err'); return; }
    remove(code, () => {
      document.getElementById('codeIn').value = '';
      const m = getMine();
      if (m && m.code.replace(/[^A-Z0-9]/g, '') === code.toUpperCase().replace(/[^A-Z0-9]/g, '')) clearMine();
    });
  });

  document.getElementById('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = document.getElementById('btn');
    btn.disabled = true; setMsg('Letar upp adressen…');
    const address = document.getElementById('street').value.trim() + ' ' +
                    document.getElementById('number').value.trim() + ', ' + CFG.TOWN;
    const name = document.getElementById('name').value;
    const scary = document.querySelector('input[name=scary]:checked').value === '1';
    try {
      const r = await api({ action: 'add', name, address, scary: scary ? '1' : '0' });
      setMsg('Tillagt: ' + r.address, 'ok');
      document.getElementById('f').reset();
      saveMine({ code: r.code, address: r.address, scary });
      load();
    } catch (e) { showErr(e); }
    btn.disabled = false;
  });

  load();
  loadMapStatus();
  restoreMine();
</script>
</body>
